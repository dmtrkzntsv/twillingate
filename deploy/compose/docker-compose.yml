# Ingestion, the tracker script and — once API_AUTH_DSN is set in `.env` —
# the API (MCP and REST) and the dashboards at /app/, all on :8080. See
# docs/deployment.md.
#
# Once it is up, create a project and issue a key:
#   docker compose exec twillingate twillingate project create -name myapp
#   docker compose exec twillingate twillingate key issue -project-id 1 -label web
# (the first project on a fresh install is id 1; `project list` shows the rest)
services:
  twillingate:
    image: ghcr.io/dmtrkzntsv/twillingate:${TWILLINGATE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"          # put Caddy/nginx/Cloudflare in front for TLS
    volumes:
      - data:/var/lib/twillingate
    env_file:
      - path: .env
        required: false
    environment:
      - GOMEMLIMIT=128MiB

  # Continuous backup: streams this database to object storage. Needs the R2
  # credentials in `.env` and deploy/litestream/litestream.yml next to this
  # file. See docs/deployment.md.
  # litestream:
  #   image: litestream/litestream:0.5
  #   restart: unless-stopped
  #   command: ["replicate", "-config", "/etc/litestream.yml"]
  #   volumes:
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #     - data:/var/lib/twillingate
  #   env_file: .env

volumes:
  data:
