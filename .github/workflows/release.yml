name: release
on:
  # By hand, so a version number is spent when someone decides to ship and
  # never as a side effect of a push. Several commits can land under one.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.2 or v0.9.2. Blank bumps the patch.'
        required: false
        type: string
      dry_run:
        description: 'Build, check and push untagged image digests, but tag and publish nothing.'
        required: false
        type: boolean
        default: false
# Each job widens this to what it needs; only the last one writes anything
# a user can see.
permissions:
  contents: read
# Serialize runs so releases are published in commit order.
concurrency:
  group: release
# Four stages. version settles the tag; build cross-compiles and checks the
# tarballs of both architectures, while test and the multi-arch image run
# side by side with it; release publishes only once all of them have
# passed, so a failure anywhere leaves no tag, no release and no tagged image,
# and only when dry_run is off.
jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Full history for the tag lookup below.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: tag
        # Blank input takes the next patch; a minor or a major is typed out at
        # dispatch. Below 1.0 the minor carries the breaking signal, so that is
        # a judgement someone makes about the release rather than a rule read
        # off the commit log.
        #
        # INPUT through env and never ${{ }} inside the script: it is free text
        # a human types, and interpolating it would run it as shell.
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            next="v${INPUT#v}"
          else
            last=$(git tag --sort=-v:refname | head -n1)
            next=$(echo "${last:-v0.0.0}" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          # The run number no longer makes the tag unique by construction, and
          # a typo would otherwise reach the release page. Check both.
          echo "$next" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "::error::malformed version: $next"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"; exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # The binary is pure Go (no cgo), so one runner cross-compiles both
  # architectures with GOARCH (make dist).
  build:
    name: build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      # VERSION explicitly: the Makefile default is `git describe`, and the
      # tag does not exist yet, so the binaries would report the previous
      # tag plus a commit suffix (v0.9.1-1-gd76e64b in v0.9.2).
      - run: make dist VERSION=${{ needs.version.outputs.tag }}
      # The runtime check: both binaries are static, and the amd64 one
      # reports the release's version, then serves ingest end to end
      # (scripts/smoke.sh: /healthz, events in, rows in the files).
      - name: runtime check
        # shell: bash adds pipefail, so a failing check is not masked by tee.
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/$arch"
            tar -xzf "dist/twillingate-linux-$arch.tar.gz" -C "$RUNNER_TEMP/$arch" ./twillingate
            file "$RUNNER_TEMP/$arch/twillingate" | tee -a "$GITHUB_STEP_SUMMARY" | grep -q 'statically linked'
            ls -l "$RUNNER_TEMP/$arch/twillingate" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          "$RUNNER_TEMP/amd64/twillingate" version | tee -a "$GITHUB_STEP_SUMMARY" | grep -qF "$TAG"
          SMOKE_BIN="$RUNNER_TEMP/amd64/twillingate" ./scripts/smoke.sh
      # The release job publishes these exact files.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # prune superseded Go caches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      # Same cache as ci.yml. Not setup-go's built-in cache: that keys on
      # go.sum alone, so it is a snapshot from the last dependency change and
      # goes staler with every commit. Keying on the sha and restoring by
      # prefix starts each run from the newest entry. Pull requests only
      # restore; this job, on main, is the one that saves, so its entry is
      # visible to every pull request.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      # The fast gate first (vet, coverage), then the full
      # suite under the race detector. -race slows the SQLite-backed packages
      # about tenfold (see `test` in the Makefile), so pull request CI leaves
      # it to here: nothing is tagged until it passes.
      - run: make check
      - run: make test
      # Saved here: this cache holds what make check compiles, which is what
      # the pull request jobs run. The build jobs keep none.
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
      # Restores take the newest entry by prefix, so older ones only hold
      # quota. Not the docker-go-build- entries the image job keeps.
      - name: keep only the newest Go cache
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
        run: |
          gh cache list --key go- --limit 100 --json id,key \
            --jq '.[] | select(.key != env.KEEP) | .id' |
            xargs -r -n1 gh cache delete

  # Builds and pushes the image untagged, by digest: one multi-arch index,
  # both architectures cross-compiled on one runner (the Dockerfile's Go
  # stage runs on the build platform). The release job tags the digest once
  # everything has passed. It runs alongside the tests rather than after
  # them, since the tests take several times as long.
  image:
    name: build docker image
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The runtime stage runs the binary once (`twillingate version`), so
      # the arm64 image needs emulation for that one step; nothing compiles
      # under it.
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - id: buildx
        uses: docker/setup-buildx-action@v3
      # The gha layer cache below skips everything up to `COPY . .`, but the
      # go build after it reruns on every commit, and from a cold compiler
      # cache it cost ~60s. The Dockerfile mounts /root/.cache/go-build; this
      # pair restores that mount from the previous release before the build
      # and saves it back afterwards (post steps run in reverse, so the dance
      # extracts before actions/cache uploads). Not the test job's Go
      # cache: setup-go and golang:1.25-bookworm resolve different patch
      # toolchains, so none of its entries would match. Keyed on the sha like
      # the Go caches, so every release saves and restores the newest; one
      # cache holds both architectures' objects.
      - id: go-build-cache
        uses: actions/cache@v4
        with:
          path: docker-go-build
          key: docker-go-build-${{ github.sha }}
          restore-keys: docker-go-build-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"docker-go-build": "/root/.cache/go-build"}'
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No tags: a pull of :latest or a version must never reach an image
      # whose release then failed. The digest goes to the release job.
      - id: push
        name: twillingate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.tag }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/twillingate,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=twillingate
          cache-to: type=gha,mode=max,scope=twillingate

  release:
    name: build and publish release
    needs: [version, build, test, image]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/twillingate
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # Full history: changelogithub derives the previous tag from the log to
      # decide which commits the notes cover. A shallow clone sees no earlier
      # tag and would restate the whole history in every release.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: checksums
        run: cd dist && sha256sum twillingate-linux-*.tar.gz > SHA256SUMS
      # The tag has to exist on the remote before the release points at it.
      - name: tag
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      # changelogithub creates the release, groups the notes by conventional
      # commit type and uploads the artifacts in one call.
      - name: release
        run: >
          npx -y changelogithub@15
          --to "$TAG"
          --assets "dist/*.tar.gz" --assets dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # After the release, so the binaries never wait on the registry. Names
      # the multi-arch index the image job pushed by digest; nothing is
      # rebuilt.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag the image
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG"
