name: release
on:
  # By hand, so a version number is spent when someone decides to ship and
  # never as a side effect of a push. Several commits can land under one.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.2 or v0.9.2. Blank bumps the patch.'
        required: false
        type: string
permissions:
  contents: write
  packages: write
# Serialize runs so releases are published in commit order.
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Full history: changelogithub derives the previous tag from the log to
      # decide which commits the notes cover. A shallow clone sees no earlier
      # tag and would restate the whole history in every release.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: tag
        # Blank input takes the next patch; a minor or a major is typed out at
        # dispatch. Below 1.0 the minor carries the breaking signal, so that is
        # a judgement someone makes about the release rather than a rule read
        # off the commit log.
        #
        # INPUT through env and never ${{ }} inside the script: it is free text
        # a human types, and interpolating it would run it as shell.
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            next="v${INPUT#v}"
          else
            last=$(git tag --sort=-v:refname | head -n1)
            next=$(echo "${last:-v0.0.0}" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          # The run number no longer makes the tag unique by construction, and
          # a typo would otherwise reach the release page. Check both.
          echo "$next" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "::error::malformed version: $next"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"; exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      # Same cache as ci.yml, restored by prefix. Releases are dispatched by
      # hand and so are far rarer than pushes; ci's test job runs on every
      # push to main and is what keeps a recent entry there to restore from.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-
      - run: make check
      # VERSION explicitly: the Makefile default is `git describe`, and the
      # tag does not exist yet, so the binaries would report the previous
      # tag plus a commit suffix (v26.913.30-1-gd76e64b in v26.913.31).
      - run: make dist VERSION=${{ steps.tag.outputs.tag }}
      # The tag has to exist on the remote before the release points at it.
      - name: tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.tag.outputs.tag }}"
      # changelogithub creates the release, groups the notes by conventional
      # commit type and uploads the artifacts in one call.
      - name: release
        run: >
          npx -y changelogithub@15
          --to "${{ steps.tag.outputs.tag }}"
          --assets "dist/*.tar.gz" --assets dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The images publish separately from the tarballs and from each other: the
  # ingestion image is a static Go binary on alpine, while the Evidence image
  # carries a Node toolchain and compiles sqlite3 from source. Parallel jobs
  # mean a slow or broken build of either image can neither hold up the
  # release of the binaries nor stop the other image from publishing.
  image-twillingate:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - id: buildx
        uses: docker/setup-buildx-action@v3
      # The gha layer cache below skips everything up to `COPY . .`, but the
      # go build after it reruns on every commit, and from a cold compiler
      # cache it cost ~60s. The Dockerfile mounts /root/.cache/go-build; this
      # pair restores that mount from the previous release before the build
      # and saves it back afterwards (post steps run in reverse, so the dance
      # extracts before actions/cache uploads). Not the release job's Go
      # cache: setup-go and golang:1.25-alpine resolve different patch
      # toolchains, so none of its entries would match. Keyed on the sha like
      # the Go caches, so every release saves and restores the newest.
      - id: go-build-cache
        uses: actions/cache@v4
        with:
          path: docker-go-build
          key: docker-go-build-${{ github.sha }}
          restore-keys: docker-go-build-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"docker-go-build": "/root/.cache/go-build"}'
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: twillingate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/twillingate:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/twillingate:latest
          cache-from: type=gha,scope=twillingate
          cache-to: type=gha,mode=max,scope=twillingate

  # No linux/arm/v7: sqlite3 publishes no prebuilds for it, and building
  # it from source under QEMU is not worth the release time. A 32-bit
  # host runs the tarball, or renders dashboards elsewhere.
  image-evidence:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - id: buildx
        uses: docker/setup-buildx-action@v3
      # Restore-only: amd64 and arm64 are a subset of the arches the
      # twillingate job compiles, so its cache (from the previous release,
      # as the two run in parallel) covers this build and one saved copy
      # per release is enough.
      - uses: actions/cache/restore@v4
        with:
          path: docker-go-build
          key: docker-go-build-${{ github.sha }}
          restore-keys: docker-go-build-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"docker-go-build": "/root/.cache/go-build"}'
          skip-extraction: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: twillingate-evidence
        uses: docker/build-push-action@v6
        with:
          context: .
          target: evidence
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/twillingate-evidence:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/twillingate-evidence:latest
          cache-from: type=gha,scope=evidence
          cache-to: type=gha,mode=max,scope=evidence
