name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # Every pull request and every push to main. Releases are dispatched by
  # hand, so this is the only thing that checks a commit once it lands, and
  # the only job that saves a build cache keyed on a main commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      # Not setup-go's built-in cache: that keys on go.sum alone, so it is a
      # snapshot from the last dependency change and goes staler with every
      # commit. Keying on the sha (unique, so every run saves) and restoring
      # by prefix starts each run from the newest cache instead. What it
      # carries is mostly the -race test builds, which dominate make check.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-
      - run: make check
      - run: make build

  # The SDK bundle is committed (internal/server/twillingate.js) so the Go
  # build never needs Node. This job keeps the artifact honest: typecheck,
  # tests, then rebuild and fail on any drift from the committed bytes.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sdk/package-lock.json }
      - run: npm ci
        working-directory: sdk
      - run: npm run typecheck
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - name: committed bundle matches the source
        run: git diff --exit-code internal/server/twillingate.js
