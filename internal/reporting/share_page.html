<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}{{with .ProjectName}} · {{.}}{{end}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Title}}">
{{with .Meta}}<meta property="og:description" content="{{.}}">
{{end}}<meta property="og:url" content="{{.URL}}">
<meta property="og:image" content="{{.ImageURL}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{.Alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:image" content="{{.ImageURL}}">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { background: #e6edf5; color: #0f1b2d; }
body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 12px; display: flex; align-items: center; font: 400 .875rem/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width: 100%; }
figure { margin: 0 auto; width: min(100%, 1200px, calc((100svh - 112px) * 1200 / 630)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pic { display: block; border-radius: 12px; outline-offset: 4px; }
.pic:focus-visible { outline: 2px solid #1478c9; }
img { display: block; width: 100%; height: auto; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(15, 27, 45, .08), 0 12px 32px -8px rgba(15, 27, 45, .18); }
figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 24px; padding: 14px 4px 0; color: #5b6b82; }
.by { display: inline-flex; align-items: center; gap: 8px; }
.by svg { flex: none; width: 18px; height: 18px; border-radius: 4px; }
a { color: inherit; text-decoration: none; }
.by a { color: #0f1b2d; font-weight: 600; }
.by a:hover, .by a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-color-scheme: dark) {
  html { background: #070c16; color: #e8eef7; }
  figcaption { color: #93a3b8; }
  .by a { color: #e8eef7; }
  .pic:focus-visible { outline-color: #62c3f3; }
  img { box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 12px 32px -8px rgba(0, 0, 0, .6); }
}
@media (min-width: 640px) { body { padding: 32px; } figcaption { padding-top: 16px; } }
</style>
</head>
<body>
<main>
<h1 class="sr">{{.Title}}</h1>
<figure>
<a class="pic" href="{{.Image2xPath}}" title="Open the full-size image"><img src="{{.Image2xPath}}" width="1200" height="630" alt="{{.Alt}}"></a>
<figcaption>
{{with .TakenInWords}}<span>Snapshot taken <time datetime="{{$.Taken}}">{{.}}</time></span>
{{end}}<span class="by">{{.Icon}}<span>Built with <a href="https://twillingate.dev" rel="noopener">twillingate.dev</a></span></span>
</figcaption>
</figure>
</main>
</body>
</html>
